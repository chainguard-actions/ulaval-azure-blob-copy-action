name: Test upload to non-existent container fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AZ_CONN: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start Azurite
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/start-azurite.sh"
      - name: Prepare local files
        run: |
          mkdir -p "$RUNNER_TEMP/missing-src"
          echo "x" > "$RUNNER_TEMP/missing-src/x.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: upload
          connection_string: ${{ env.AZ_CONN }}
          container_name: doesnotexist
          local_directory: ${{ runner.temp }}/missing-src
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          echo "PASS"
