name: Test upload with http_headers
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local directory with test files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload-headers-test"
          echo "console.log('hello');" > "$GITHUB_WORKSPACE/upload-headers-test/app.js"
          echo "<html><body>Hello</body></html>" > "$GITHUB_WORKSPACE/upload-headers-test/index.html"
          echo "body { color: red; }" > "$GITHUB_WORKSPACE/upload-headers-test/style.css"

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: upload
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fakeaccount;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWs=;EndpointSuffix=core.windows.net"
          container_name: "test-container"
          local_directory: "upload-headers-test"
          http_headers: |
            - glob: "**/*.js"
              headers:
                Cache-Control: public, max-age=604800, immutable
                Content-Type: application/javascript

            - glob: "**/*.html"
              headers:
                Cache-Control: public, no-cache
                Content-Type: text/html; charset=utf-8

            - glob: "**/*"
              headers:
                Cache-Control: public, no-cache

      - name: Assert action ran (upload with headers and fake connection string fails gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid connection string"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real Azure endpoint reachable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
